[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-runner-protocol"
version = "0.1.0"
description = "WS orchestrator<->runner protocol messages + harness-adapter ABC and reference adapters for Stapel Studio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["stapel", "studio", "runner", "protocol", "websocket", "harness", "agents"]
authors = [{ name = "Stapel" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "stapel-taskspecs>=0.1,<0.2",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# Thin websockets transport wrapper (transport-agnostic core needs neither).
websockets = ["websockets>=12"]
# Reference agent-sdk adapter (interface + extraction logic work without it).
agent-sdk = ["claude-agent-sdk>=0.2"]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-runner-protocol"
Repository = "https://github.com/usestapel/stapel-runner-protocol"
Documentation = "https://github.com/usestapel/stapel-runner-protocol#readme"
Changelog = "https://github.com/usestapel/stapel-runner-protocol/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-runner-protocol/issues"

[tool.setuptools]
package-dir = { "stapel_runner_protocol" = "." }
packages = ["stapel_runner_protocol"]

[tool.setuptools.package-data]
stapel_runner_protocol = ["py.typed", "schemas/*.json"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "--tb=short -q --import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/tests/*"]
